services:
  - type: web
    name: tft-hideout-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    branch: main
    autoDeploy: true
    healthCheckPath: /health
