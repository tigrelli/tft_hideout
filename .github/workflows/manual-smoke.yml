name: Manual Smoke Test

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Echo success
        run: echo "workflow_dispatch 수동 트리거 성공"
      - name: Check secret is readable (value not logged)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret set: true"
          else
            echo "DATABASE_URL secret set: false"
          fi
