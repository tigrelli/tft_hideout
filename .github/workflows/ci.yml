name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tft_hideout_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/tft_hideout_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/tft_hideout_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: ruff check
        working-directory: backend
        run: ruff check .
      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .
      - name: pytest
        working-directory: backend
        run: pytest

  batch-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tft_hideout_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/tft_hideout_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5433/tft_hideout_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install batch dependencies
        working-directory: batch
        run: pip install -r requirements-dev.txt
      - name: ruff check
        working-directory: batch
        run: ruff check .
      - name: ruff format --check
        working-directory: batch
        run: ruff format --check .
      - name: pytest
        working-directory: batch
        run: pytest

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check frontend project exists
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Node
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm ci
      - name: ESLint
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run lint
      - name: Prettier --check
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run format:check
      - name: Vitest
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm test
      - name: Next build (static export)
        if: steps.check.outputs.exists == 'true'
        working-directory: frontend
        run: npm run build
      - name: Skip (frontend not scaffolded yet)
        if: steps.check.outputs.exists == 'false'
        run: echo "frontend/package.json 없음 — FE-01 완료 전까지 스킵"
