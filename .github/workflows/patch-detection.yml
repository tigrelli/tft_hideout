name: Patch Detection & Batch Collection

# DATA-14: workflow_dispatch로 프로덕션 검증 완료(2026-08-04, docs/verification/DATA-14-작업결과.md).
# schedule은 매시간(PRD 9-1 원안) 대신 1일 1회(매일 03:00 KST)로 PM 결정(2026-08-04).
# 이유: TFT 패치는 월 1~2회뿐이라 매시간 감지는 720회/월 중 대부분이 변경없음 확인으로
# GitHub Actions 무료 분(2,000분/월, CI와 공유) 중 약 36%를 소모하는 반면, 1일 1회는
# 약 1.5%만 소모. 패치 발생 후 최대 24시간 지연은 workflow_dispatch 수동 트리거로
# 즉시 만회 가능(개인/지인 10명 규모 MVP라 실질 영향 없음).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 매일 18:00 UTC = 03:00 KST(다음날)

concurrency:
  group: patch-detection
  # DATA-14 목적 그 자체: 이미 실행 중인 배치가 있으면 새 트리거는 취소하지 않고
  # 대기열에서 기다렸다가 실행한다(CI의 cancel-in-progress:true와 반대 — 배치
  # 도중 취소하면 부분 적재 상태가 애매해질 수 있어 안전하게 순차 실행).
  cancel-in-progress: false

jobs:
  detect-and-collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install batch dependencies
        working-directory: batch
        run: pip install -r requirements.txt
      - name: Run patch detection & batch collection
        working-directory: batch
        run: python run_patch_batch.py
